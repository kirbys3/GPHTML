<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103b46">
  <title>Sign In — Surfside Grill &amp; Pizzeria</title>
  <style>
    :root{--sea:#214a73;--sea2:#0aa9a8;--coral:#c62036;--sand:#fffef9;--sun:#f4ee00;--ink:#213d5b;--muted:#66778a;--line:#e6e9ed}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f9fa}.announcement{background:var(--sea);color:#fff;text-align:center;padding:10px 16px;font-size:11px;font-weight:800;letter-spacing:.04em}.announcement span{color:var(--sun);margin-left:8px}header{height:74px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(6vw,22px);border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand-mark{width:54px;height:54px;object-fit:contain;border-radius:12px;background:transparent;box-shadow:none;display:block;flex:none}.brand-name{font-size:15px;line-height:1}.brand-name small{display:block;color:var(--sea2);font-size:8px;letter-spacing:1.4px;text-transform:uppercase;margin-top:5px}.back{font-size:12px;font-weight:800;color:var(--sea2)}main{min-height:calc(100vh - 154px);display:grid;place-items:center;padding:35px 18px}.signin-card{width:min(100%,420px);padding:32px;background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 12px 35px #2032380c}.eyebrow{font-size:10px;color:var(--coral);font-weight:900;text-transform:uppercase;letter-spacing:.16em}.signin-card h1{font-size:30px;letter-spacing:-.05em;margin:8px 0}.signin-card>p{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 22px}.field{display:block;margin:14px 0}.field span{display:block;font-size:11px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #dfe4df;border-radius:7px;font:inherit;font-size:12px;outline-color:var(--sea2)}.password-wrap{position:relative}.password-wrap input{padding-right:65px}.toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--sea2);font-size:10px;font-weight:800;cursor:pointer}.submit{width:100%;padding:13px;border:0;border-radius:8px;background:var(--coral);color:white;font-size:12px;font-weight:900;cursor:pointer;margin-top:8px}.submit:hover{background:#a71b30}.notice{display:none;margin-top:14px;padding:11px;border-radius:8px;background:#fff0f1;color:#a21e35;font-size:11px;line-height:1.5}.notice.show{display:block}.privacy-note{border-top:1px solid var(--line);padding-top:15px;margin-top:20px!important;font-size:10px!important}footer{text-align:center;padding:20px;color:var(--muted);font-size:10px;border-top:1px solid var(--line);background:white}@media(max-width:500px){header{height:66px;padding:0 16px}.signin-card{padding:25px 21px}}
  </style>
</head>
<body>
  <div class="announcement"><span>Lunch 11–3 · Dinner 3–9</span></div>
  <header><a class="brand" href="index.html"><img class="brand-mark" src="surfside-logo.jpg" alt="Surfside Grill &amp; Pizzeria"><span class="brand-name">Surfside<small>Grill &amp; Pizzeria</small></span></a><a class="back" href="index.html">← Back to Surfside</a></header>
  <main><section class="signin-card"><div class="eyebrow">Welcome back</div><h1>Sign in</h1><p>Sign in to your Surfside account to make ordering easier.</p><form id="signinForm"><label class="field"><span>Email address</span><input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label><label class="field"><span>Password</span><div class="password-wrap"><input id="password" type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required><button class="toggle" id="togglePassword" type="button">Show</button></div></label><button class="submit" type="submit">Sign in</button><div class="notice" id="notice" role="status">Account sign-in isn’t connected yet.</div></form></section></main>
  <footer>© 2026 Surfside Grill &amp; Pizzeria · Made for good times.</footer>
  <script>
    const password=document.getElementById('password');document.getElementById('togglePassword').addEventListener('click',event=>{const reveal=password.type==='password';password.type=reveal?'text':'password';event.currentTarget.textContent=reveal?'Hide':'Show'});document.getElementById('signinForm').addEventListener('submit',event=>{event.preventDefault();document.getElementById('notice').classList.add('show')});
  </script>
</body>
</html>
