<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103b46">
  <title>Your Orders — Surfside Grill &amp; Pizzeria</title>
  <style>
    :root{--sea:#214a73;--sea2:#0aa9a8;--coral:#c62036;--sand:#fffef9;--sun:#f4ee00;--ink:#213d5b;--muted:#66778a;--line:#e6e9ed}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f9fa}a{color:inherit;text-decoration:none}.announcement{background:var(--sea);color:white;text-align:center;padding:10px 16px;font-size:11px;font-weight:800;letter-spacing:.04em}.announcement span{color:var(--sun);margin-left:8px}header{height:74px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(6vw,22px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand-mark{width:54px;height:54px;object-fit:contain;border-radius:12px;background:transparent;box-shadow:none;display:block;flex:none}.brand-name{font-size:15px;line-height:1}.brand-name small{display:block;color:var(--sea2);font-size:8px;letter-spacing:1.4px;text-transform:uppercase;margin-top:5px}.back{font-size:12px;font-weight:800;color:var(--sea2)}main{max-width:900px;margin:auto;padding:43px 24px 70px}.eyebrow{font-size:10px;color:var(--coral);font-weight:900;text-transform:uppercase;letter-spacing:.16em}.intro h1{font-size:38px;letter-spacing:-.055em;margin:8px 0}.intro p{font-size:13px;color:var(--muted);margin:0 0 26px}.order-list{display:grid;gap:13px}.order-card{background:white;border:1px solid var(--line);border-radius:13px;padding:20px 22px;box-shadow:0 6px 20px #20323808}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:center;padding-bottom:13px;border-bottom:1px solid var(--line)}.order-id{font-size:13px;font-weight:900}.order-date{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:4px}.badge{background:#e5f8f7;color:var(--sea);border-radius:99px;padding:7px 10px;font-size:10px;font-weight:850}.order-lines{padding:11px 0}.order-line{display:flex;justify-content:space-between;gap:15px;padding:5px 0;font-size:11px}.order-total{border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;font-size:13px;font-weight:900}.empty{background:white;border:1px solid var(--line);border-radius:14px;padding:38px 20px;text-align:center}.empty-icon{font-size:46px}.empty h2{font-size:20px;margin:10px 0 7px}.empty p{font-size:12px;color:var(--muted);margin:0 0 18px}.button{display:inline-flex;justify-content:center;align-items:center;border-radius:8px;padding:13px 17px;background:var(--coral);color:white;font-size:12px;font-weight:850}.button:hover{background:#a71b30}footer{text-align:center;padding:22px;color:var(--muted);font-size:10px;border-top:1px solid var(--line);background:white}
    @media(max-width:600px){header{height:66px;padding:0 16px}main{padding:30px 15px 48px}.intro h1{font-size:32px}.order-card{padding:16px}.order-head{align-items:flex-start}}
  </style>
</head>
<body>
  <div class="announcement"><span>Lunch 11–3 · Dinner 3–9</span></div>
  <header><a class="brand" href="index.html"><img class="brand-mark" src="surfside-logo.jpg" alt="Surfside Grill &amp; Pizzeria"><span class="brand-name">Surfside<small>Grill &amp; Pizzeria</small></span></a><a class="back" href="index.html#menu">← Back to menu</a></header>
  <main><div class="intro"><div class="eyebrow">Good to see you again</div><h1>Your Orders</h1><p>Review the orders placed from this account.</p></div><div class="order-list" id="orderList"></div></main>
  <footer>© 2026 Surfside Grill &amp; Pizzeria · Made for good times.</footer>
  <script>
    const list=document.getElementById('orderList');let orders=[];try{orders=JSON.parse(localStorage.getItem('surfside-orders')||'[]')}catch{orders=[]}
    if(!Array.isArray(orders)||orders.length===0){const empty=document.createElement('section');empty.className='empty';empty.innerHTML='<div class="empty-icon">🍕</div><h2>No orders yet</h2><p>Your completed orders will appear here.</p><a class="button" href="index.html#menu">Explore the menu</a>';list.append(empty)}else{orders.forEach(order=>{const card=document.createElement('article');card.className='order-card';const head=document.createElement('div');head.className='order-head';const info=document.createElement('div');const id=document.createElement('div');id.className='order-id';id.textContent=order.id||'Surfside order';const date=document.createElement('time');date.className='order-date';date.dateTime=order.date||'';date.textContent=order.date?new Date(order.date).toLocaleString():'Recently placed';info.append(id,date);const badge=document.createElement('span');badge.className='badge';badge.textContent=order.mode==='pickup'?'Pickup':'Delivery';head.append(info,badge);const lines=document.createElement('div');lines.className='order-lines';(order.items||[]).forEach(item=>{const line=document.createElement('div');line.className='order-line';const name=document.createElement('span');name.textContent=`${item.quantity} × ${item.name}`;const price=document.createElement('strong');price.textContent=`$${(item.price*item.quantity).toFixed(2)}`;line.append(name,price);lines.append(line)});const total=document.createElement('div');total.className='order-total';const label=document.createElement('span');label.textContent='Order total';const amount=document.createElement('span');amount.textContent=`$${Number(order.total||0).toFixed(2)}`;total.append(label,amount);const note=document.createElement('p');card.append(head,lines,total,note);list.append(card)})}
  </script>
</body>
</html>
